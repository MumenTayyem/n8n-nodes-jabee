<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jabee">
  <title>Jabee</title>
  <!--
    The tile version of the mark, not the outline one shrunk down.

    n8n draws a node icon at around 40px on a card that is light in one
    theme and dark in the other. A 5.5 unit stroke is under a pixel at
    that size, and a mark that is only a stroke disappears against one of
    the two backgrounds, so this is the solid artwork the favicon uses:
    its own ground, readable either way.

    Never WhatsApp green and never the WhatsApp logo: Jabee is not
    endorsed by Meta and the mark must not imply it is.
  -->
  <rect width="64" height="64" rx="14" fill="#1f5f43"/>
  <path fill="#fbfbf9"
        d="M13 12h22a8 8 0 0 1 8 8v16a8 8 0 0 1-8 8H23l-10 9v-9a8 8 0 0 1-8-8V20a8 8 0 0 1 8-8z"/>
  <circle cx="52" cy="28" r="8" fill="#d3ab48"/>
</svg>
